
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Location Sharing</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px 20px;
}
.card {
  background: #1e293b;
  padding: 30px;
  border-radius: 18px;
  max-width: 420px;
  margin: auto;
}
button {
  background: #22c55e;
  color: white;
  border: none;
  padding: 15px 22px;
  border-radius: 10px;
  margin: 10px;
  cursor: pointer;
}
#send { display: none; }
#result { margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>📍 Location Sharing</h1>
  <p>
    Share your current location with the
    person who sent you this page.
  </p>
  <p>
    Your browser will ask for permission.
    You can review your location before
    choosing to send it.
  </p>
  <button onclick="getLocation()">
    Share My Location
  </button>
  <div id="result"></div>
  <button id="send" onclick="sendLocation()">
    Send My Location
  </button>
</div>
<script>
let locationLink = "";

function getLocation() {
  const result = document.getElementById("result");
  const send = document.getElementById("send");
  send.style.display = "none";

  if (!navigator.geolocation) {
    result.textContent =
      "Location access is unavailable.";
    return;
  }

  result.textContent =
    "Waiting for location permission...";

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      locationLink =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(lat + "," + lon);

      result.innerHTML =
        "<p>Your approximate coordinates:</p>" +
        "<p>" + lat.toFixed(5) + ", " +
        lon.toFixed(5) + "</p>" +
        "<a style='color:#93c5fd' " +
        "href='" + locationLink +
        "' target='_blank'>View on map</a>";

      send.style.display = "inline-block";
    },
    () => {
      result.textContent =
        "Location permission was denied " +
        "or your location is unavailable.";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000
    }
  );
}

async function sendLocation() {
  const message =
    "I agree to share my location: " +
    locationLink;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "My Location",
        text: message
      });
    } catch (error) {
      if (error.name !== "AbortError") {
        alert("Sharing failed. Please try again.");
      }
    }
  } else {
    await navigator.clipboard.writeText(message);
    alert("Location link copied. " +
          "Send it to the person who asked.");
  }
}
</script>
</body>
</html>
